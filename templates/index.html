<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVM Predictor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Poppins',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;color:#fff;overflow-x:hidden;
  background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
}
/* floating blobs */
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.55;z-index:0;animation:float 12s ease-in-out infinite}
.b1{width:340px;height:340px;background:#ff6ec7;top:-80px;left:-80px}
.b2{width:380px;height:380px;background:#4facfe;bottom:-100px;right:-100px;animation-delay:-4s}
.b3{width:260px;height:260px;background:#a855f7;top:50%;left:60%;animation-delay:-8s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-50px) scale(1.15)}}

.card{
  position:relative;z-index:1;width:100%;max-width:500px;padding:40px 36px;border-radius:26px;
  background:rgba(255,255,255,.08);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:1px solid rgba(255,255,255,.18);box-shadow:0 25px 60px rgba(0,0,0,.45);
  animation:rise .9s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
.icon{font-size:42px;text-align:center;animation:pulse 2.5s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
h1{text-align:center;font-size:28px;font-weight:700;margin:6px 0 4px;
  background:linear-gradient(90deg,#ff6ec7,#4facfe,#a8ff78);-webkit-background-clip:text;background-clip:text;color:transparent;
  background-size:200% auto;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:200% center}}
.sub{text-align:center;font-size:13px;font-weight:300;opacity:.75;margin-bottom:26px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
label{font-size:12px;letter-spacing:.8px;text-transform:uppercase;opacity:.8}
input,select{
  width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.1);color:#fff;font:inherit;font-size:15px;outline:none;transition:.3s;
}
select option{color:#222}
input::placeholder{color:rgba(255,255,255,.45)}
input:focus,select:focus{border-color:#4facfe;background:rgba(255,255,255,.16);box-shadow:0 0 0 4px rgba(79,172,254,.25);transform:translateY(-2px)}
button{
  grid-column:1/-1;margin-top:8px;padding:15px;border:none;border-radius:14px;cursor:pointer;
  font:inherit;font-size:16px;font-weight:600;color:#fff;letter-spacing:.5px;
  background:linear-gradient(90deg,#ff6ec7,#7873f5,#4facfe);background-size:200% auto;
  box-shadow:0 10px 25px rgba(120,115,245,.5);transition:.35s;
}
button:hover{background-position:right center;transform:translateY(-3px);box-shadow:0 16px 32px rgba(120,115,245,.65)}
button:active{transform:scale(.98)}
button.loading{pointer-events:none;opacity:.7}

.result{margin-top:26px;padding:22px;border-radius:18px;text-align:center;display:none;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.result.yes{display:block;background:linear-gradient(135deg,rgba(56,239,125,.25),rgba(17,153,142,.25));border:1px solid rgba(56,239,125,.6);box-shadow:0 0 30px rgba(56,239,125,.35)}
.result.no{display:block;background:linear-gradient(135deg,rgba(255,75,100,.25),rgba(255,153,102,.25));border:1px solid rgba(255,100,110,.6);box-shadow:0 0 30px rgba(255,90,100,.35)}
.result.err{display:block;background:rgba(255,200,0,.15);border:1px solid rgba(255,200,0,.5)}
.emoji{font-size:44px}
.verdict{font-size:26px;font-weight:700;margin:4px 0}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:12px}
.bar span{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#4facfe,#a8ff78);transition:width 1s ease}
.conf{font-size:12px;opacity:.8;margin-top:6px}
footer{text-align:center;font-size:11px;opacity:.5;margin-top:22px}
@media(max-width:480px){.grid{grid-template-columns:1fr}.card{padding:30px 22px}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<main class="card">
  <div class="icon">🤖</div>
  <h1>SVM Predictor</h1>
  <p class="sub">Enter the details below and let the model decide</p>

  <form id="form" class="grid">
    <div class="field">
      <label for="age">Age</label>
      <input type="number" id="age" min="1" max="120" placeholder="e.g. 28" required>
    </div>
    <div class="field">
      <label for="gender">Gender</label>
      <select id="gender" required>
        {% for k,v in genders.items() %}<option value="{{v}}">{{k}}</option>{% endfor %}
      </select>
    </div>
    <div class="field">
      <label for="region">Region</label>
      <select id="region" required>
        {% for k,v in regions.items() %}<option value="{{v}}">{{k}}</option>{% endfor %}
      </select>
    </div>
    <div class="field">
      <label for="occupation">Occupation</label>
      <select id="occupation" required>
        {% for k,v in occupations.items() %}<option value="{{v}}">{{k}}</option>{% endfor %}
      </select>
    </div>
    <div class="field full">
      <label for="income">Income</label>
      <input type="number" id="income" min="0" step="any" placeholder="e.g. 45000" required>
    </div>
    <button type="submit" id="btn">✨ Predict</button>
  </form>

  <div id="result" class="result"></div>
  <footer>Powered by Support Vector Machine · Flask</footer>
</main>

<script>
const form=document.getElementById('form'),btn=document.getElementById('btn'),box=document.getElementById('result');
form.addEventListener('submit',async e=>{
  e.preventDefault();
  btn.classList.add('loading');btn.textContent='⏳ Thinking...';box.className='result';box.style.display=' ';
  const body={age:age.value,gender:gender.value,region:region.value,occupation:occupation.value,income:income.value};
  try{
    const r=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(!d.ok) throw new Error(d.error);
    const yes=d.prediction.toLowerCase()==='yes';
    box.className='result '+(yes?'yes':'no');
    box.innerHTML=`<div class="emoji">${yes?'🎉':'🙅'}</div>
      <div class="verdict">${yes?'Yes!':'No'}</div>
      <div class="bar"><span id="fill"></span></div>
      <div class="conf">Model confidence: ${d.confidence}%</div>`;
    requestAnimationFrame(()=>setTimeout(()=>document.getElementById('fill').style.width=d.confidence+'%',50));
  }catch(err){
    box.className='result err';box.innerHTML='⚠️ '+err.message;
  }
  btn.classList.remove('loading');btn.textContent='✨ Predict';
});
</script>
</body>
</html>
